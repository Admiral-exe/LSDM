<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lsdm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="emerald-liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="20" ry="20" fill="url(#lsdm-bg)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Flask Body (Geometric Minimalist) -->
  <path d="M 43 20 L 57 20 M 44 20 L 44 38 L 22 70 A 4 4 0 0 0 25.5 76 L 74.5 76 A 4 4 0 0 0 78 70 L 56 38 L 56 20" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Liquid inside Flask -->
  <path d="M 33 54 L 67 54 L 74 72 L 26 72 Z" fill="url(#emerald-liquid)" />
  <line x1="33" y1="54" x2="67" y2="54" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Nodes / Bubbles -->
  <circle cx="46" cy="62" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="55" cy="65" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="48" cy="46" r="1.8" fill="#10b981" opacity="0.9" />

  <!-- Dynamic Dispatch Satellite Orbit -->
  <path d="M 16 75 A 36 12 0 0 0 84 75" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
  <circle cx="82" cy="74" r="3" fill="#34d399" />
</svg>
